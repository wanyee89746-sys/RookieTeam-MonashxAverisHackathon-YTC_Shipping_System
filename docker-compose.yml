services:
  backend:
    build: .
    command: uvicorn api:app --app-dir app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: app/.env
        required: false
    environment:
      OVERRIDES_PATH: /state/overrides.json
    volumes:
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy